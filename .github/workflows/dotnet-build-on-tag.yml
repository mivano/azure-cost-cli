# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build, Pack and Release on Tag

on:
  push:
    tags:
      - '*'

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
      

permissions:
  contents: write
  discussions: write
  id-token: write # GitHub OIDC token for NuGet trusted publishing

jobs:
  build-pack-release:
    runs-on: ubuntu-latest
    if: |
      (!startsWith(github.event.head_commit.message, 'skip-ci') 
      && !startsWith(github.event.head_commit.message, 'chore:'))
      || startsWith(github.ref, 'refs/tags/')
    defaults:
      run:
        working-directory: ./src
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          
    - name: Get the tag version
      id: get_version
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

    - name: Build and Pack
      run: |
        dotnet build --configuration Release /p:Version=$TAG_NAME /p:AssemblyVersion=$TAG_NAME /p:FileVersion=$TAG_NAME
        dotnet pack --configuration Release /p:PackageVersion=$TAG_NAME /p:Version=$TAG_NAME /p:AssemblyVersion=$TAG_NAME /p:FileVersion=$TAG_NAME --output nupkgs

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: src/nupkgs/*.nupkg

    # Trusted publishing: exchange the GitHub OIDC token for a short-lived (1 hour) nuget.org API key.
    # Requires a trusted publishing policy on nuget.org for mivano/azure-cost-cli + dotnet-build-on-tag.yml.
    - name: NuGet login (OIDC -> temporary API key)
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: mivano # nuget.org profile name of the package owner (not an email address)

    - name: Push NuGet Package
      run: |
        dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        files: src/nupkgs/*.nupkg
        generate_release_notes: true


