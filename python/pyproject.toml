[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cost-cli"
version = "1.0.0"
description = "Azure Cost CLI – Python port of the .NET azure-cost-cli tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "azure-identity>=1.15",
    "httpx>=0.27",
    "rich>=13",
    "jmespath>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.20",
]

[project.scripts]
azure-cost = "azure_cost_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
